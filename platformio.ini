; PlatformIO Unit Testing configuration for the ReactiveArduino library.
;
; Run the tests with:
;     pio test -e native
;
; The `native` environment compiles and runs the tests on the host machine.
; Arduino hardware functions (millis, micros, pinMode, digitalWrite, analogWrite,
; analogRead, digitalRead, String, Serial) are stubbed in test/WProgram.h so the
; header-only library can be exercised without a board.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags =
    -Isrc
    -Itest
